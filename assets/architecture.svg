<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1160" viewBox="0 0 1520 1160" role="img" aria-labelledby="architecture-title architecture-desc">
<title id="architecture-title">Arquitetura do módulo Pagou para WHMCS</title>
<desc id="architecture-desc">Área do cliente, administração e cron acionam a integração Pagou. O runtime coordena uma fila persistente e adaptadores que acessam a API. Eventos assinados e conciliação alimentam a conferência de identidade, valor e fatura. O ledger controla o registro do recebimento nos mecanismos nativos do WHMCS. As tabelas ficam no banco do WHMCS e PDFs em armazenamento privado. Cartão depende de habilitação e usa tokenização no navegador; split é consultado, sem criação de regras.</desc>
